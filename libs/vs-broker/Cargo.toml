[package]
name = "vs-broker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "broker_tcp_server"
path = "bin/broker_tcp_server.rs"

[[bin]]
name = "broker_tcp_client"
path = "bin/broker_tcp_client.rs"

[dependencies]

anyhow = "1.0.104"
log = "0.4.34"
thiserror = "2.0.20"
tracing = "0.1.44"

pretty_env_logger = "0.5.0"

tokio = { version = "1.0", features = ["macros", "sync", "time", "net", "rt-multi-thread", "rt"] }
rand = "0.8.5"
serde = { version = "1.0.229", features = ["derive", "rc"] }
bincode = "1.3.3"
vs-data-store = { path = "../vs-data-store" }
vs-wtf = { path = "../vs-wtf" }
test-log = "0.2.16"
serde_json = "1.0.132"
test-env-log = "0.2.8"
env_logger = "0.11.11"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.31"
rmp-serde = "1.3.0"
rmp = "0.8.14"
