[package]
name = "vs-data-store"
version = "0.0.1"
edition = "2021"



[dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
anyhow = "1.0.104"
arrow = "59.2.0"
log = "0.4.34"
thiserror = "2.0.20"
tracing = "0.1.44"
vs-wtf = { path = "../vs-wtf" }
env_logger = "0.11.11"
memuse = "0.2.2"
tracing-subscriber = "0.3.23"

tracing-tracy = { version = "0.11.4", features = ["callstack-inlines", "code-transfer", "delayed-init", "sampling", "system-tracing"] }
lazy_static = "1.5.0"
rand = "0.10.2"

tokio = { version = "1.53.1", features = ["full"] }
rmp-serde = "1.3.1"
pretty_env_logger = "0.5.0"
clap = { version = "4.6.6", features = ["derive"] }


[dev-dependencies]
sensible-env-logger = "0.3"
divan = "0.1.14"



[dependencies.tracy]
package = "tracy_full"
version = "1.13.0"
features = ["enable"]


[[bench]]
name = "serde"
harness = false

[[bench]]
name = "serde_tracy"
harness = false
