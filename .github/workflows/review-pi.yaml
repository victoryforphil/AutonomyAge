name: Review (pi)

# Greptile-style PR review bot powered by pi (coding agent) + OpenRouter + DeepSeek V4 Flash.
# See .agents/reviewer/README.md.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-pi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'deepseek/deepseek-v4-flash' }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # `pull_request_target` loads this workflow from the base branch. Keep that
      # boundary intact: no executable code or review configuration comes from the PR.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch PR head for diffing
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pi (coding agent)
        run: npm install -g @earendil-works/pi-coding-agent@0.84.2

      - name: Run parser tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run review bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 .github/scripts/review_bot.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --rules REVIEW.md \
            --reviewer .agents/reviewer/SKILL.md \
            --task-note "docs/tasks/review-bot-pi.task.md" \
            --marker "<!-- review-bot:v1 -->"
