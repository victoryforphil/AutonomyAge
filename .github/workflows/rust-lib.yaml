name: Rust

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Discover every workspace crate and emit a dynamic matrix entry per crate.
  # Using `cargo metadata` keeps this resilient to crate (re)naming / moves.
  crates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Discover workspace crates
        id: matrix
        shell: bash
        run: |
          matrix="$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -c '[.packages[] | select(.targets | map(.kind) | flatten | index("lib") or index("bin")) | .name]')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Discovered crates: $matrix"

  # One job per crate: build then test with cargo-nextest.
  build-test:
    needs: crates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.crates.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.package }}
      - name: Build
        run: cargo build -p "${{ matrix.package }}" --locked
      - name: Test
        run: cargo nextest run -p "${{ matrix.package }}" --locked

  # Workspace-wide coverage. Best effort: never blocks the run going green.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Collect coverage data (including doctests)
        run: |
          cargo llvm-cov --no-report nextest
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
