name: Review (opencode)

# Greptile-style PR review bot powered by opencode (v2 beta) + OpenRouter + DeepSeek V4 Flash.
# See .agents/reviewer/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-opencode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'deepseek/deepseek-v4-flash' }}

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opencode (v2 beta)
        # Pin to a specific beta so CI is reproducible (moving tag = non-reproducible).
        run: npm install -g opencode-ai@0.0.0-beta-202608110357

      - name: Run parser tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run review bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT with `repo` scope enables full thread resolve/unresolve;
          # the default GITHUB_TOKEN cannot resolve GraphQL review threads.
          GH_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 .github/scripts/review_bot.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --harness opencode \
            --rules REVIEW.md \
            --reviewer .agents/reviewer/SKILL.md \
            --task-note "docs/tasks/review-bot-opencode.task.md" \
            --marker "<!-- review-bot:v1 -->"
